version: "2.5.6"
date: "2026-08-01"
changes:
  - version: "2.5.6"
    date: "2026-08-01"
    type: "patch"
    summary: "Barrier visibility fix for ALL players, ranked random join fix, team selector preservation, replay TNT creeper safety, backward rotation fix, equipment clear fix, map persistence fallback, hologram permanent entity fix"
    items:
      - "Border: Fix barrier blocks not visible to ALL players - always place hidden BARRIER item in slot 8 even if occupied (save and restore displaced item), prevent moving/dropping the barrier item via inventory click/drag/drop event handlers"
      - "Random Join: Fix /bw randomjoin placing players in ranked arenas when ranked addon is disabled - isRankedArena() now checks group prefix regardless of addon status"
      - "Team Selector: Fix BedWarsTeam.sendDefaultInventory() clearing BedWars custom-data items (team selector, border visibility) when clean=true - now preserves and restores them after placing default items"
      - "Replay TNT: Add safety check in onCreatureSpawn to prevent TNTPrimed from being recorded with Creeper type ID (Bukkit 1.8 getTypeId conflict); redirect to onEntitySpawn handler"
      - "Replay Fake Player: Fix backward body rotation - use consistent 180° yaw flip instead of unreliable atan2 movement direction calculation; fixes body not rotating when head faces backward"
      - "Replay Inventory/Armor: Fix equipment clear on rewind - send air ItemStack instead of null in PacketPlayOutEntityEquipment; some 1.8 clients don't handle null equipment packets correctly"
      - "Replay Map Persistence: Add fallback to read arena YAML config file for world name when SlimeLoader can't find the source world; fixes 34 missing worlds on reload"
      - "Replay NPC/Hologram: Fix hologram ArmorStands not marked as permanent - only mark invisible ArmorStands (hologram text) as permanent, not health bars; prevents shop/hologram entities from being culled by distance"

  - version: "2.5.5"
    date: "2026-08-01"
    type: "patch"
    summary: "Border overhaul, random join ranked fix, team selector/bed item fix, replay TNT creeper fix, fake player backward rotation, inventory/armor rollback, replay map persistence, NPC/hologram visibility"
    items:
      - "Border: Remove scattered STAINED_GLASS_PANE proximity effects entirely; replace with solid BARRIER block wall visible to all players via hidden barrier item in inventory"
      - "Border: Fix 10-block death threshold - players can now cross border and walk up to 10 blocks before dying (previously teleported back immediately)"
      - "Border: Remove WorldBorderListener move cancellation that prevented crossing; let WorldBorderEnforcer handle everything"
      - "Border: Remove lobby and replay scattered glass pane effects; keep only snap-back in replay"
      - "Random Join: Add ranked arena filtering to Arena.joinRandomArenaAsync and joinRandomFromGroupAsync - prevents /bw randomjoin from entering ranked groups"
      - "Random Join: Only Discord test bot queue can enter ranked arenas; admins bypass restriction"
      - "Team Selector & Bed Item: Fix slot conflict in inventory preservation - when a preserved item's slot is occupied, find alternative empty slot instead of dropping it"
      - "Team Selector & Bed Item: Apply slot conflict fix to PlayerGoods.preparePlayer, sendPreGameCommandItems, and sendSpectatorCommandItems"
      - "Replay TNT: Fix Bukkit 1.8 entity type ID conflict where both CREEPER and PRIMED_TNT have getTypeId()=50; assign unique ID 91 for Creeper in recorder and add case 91 in player"
      - "Replay Fake Player: Fix backward body rotation by calculating body yaw from movement direction instead of simple 180° flip; handles forward/backward/strafing correctly in rewind mode"
      - "Replay Inventory/Armor: Fix rollback on rewind - clear all equipment and cached inventories before replaying events up to target timestamp; also replay HELD_ITEM_CHANGE events"
      - "Replay Map Persistence: Fix 34 missing worlds on reload - strip clone suffixes to find base template arena; fall back to loading directly from SlimeLoader if arena object not available"
      - "Replay NPC/Hologram: Add refreshMissingPermanentEntities() method that re-spawns permanent entities missing from clientVisibleEntities; call every 40 ticks as safety net"
      - "Replay NPC/Hologram: Fix forceRespawnEntitiesInChunk to add entities to clientVisibleEntities after re-spawn"

  - version: "2.5.3"
    date: "2026-08-01"
    type: "patch"
    summary: "Fix replay block cleanup on restart, fake player movement on backward skip, display names, viewer block interaction"
    items:
      - "Fix block cleanup on first replay restart (snapshot original states before batch task to prevent premature data loss)"
      - "Remove block reversion count message from viewer chat during replay restart"
      - "Fix fake player movement corruption when using 10-second backward skip (use rebuildInterpolationStateUpTo for correct delta-encoding accumulation)"
      - "Fix fake player name tag turning white or incorrect after backward time skip"
      - "Fix fake player name tag not updating during reverse playback in tick loop"
      - "Prevent replay viewers from placing blocks while watching replays"
      - "Prevent replay viewers from picking up items while watching replays"
      - "Prevent replay viewers from using creative inventory while watching replays"

  - version: "2.5.2"
    date: "2026-08-01"
    type: "patch"
    summary: "Remove /bw menu completely, fix /bw debug tab, fix Speed Down reverse playback, fix replay restart, fix fake player items"
    items:
      - "Remove /bw menu command and CmdMenu class entirely - use /bw cosmetics and /bw quests directly"
      - "Fix /bw debug tab completion now works for operators in arena while playing"
      - "Fix Speed Down now enables reverse playback mode (backward at 1x/2x/4x speed)"
      - "Fix Speed Down auto-switches to 1x forward when reaching time 0"
      - "Fix Speed Up resets to forward mode when currently in reverse playback"
      - "Fix replay restart skips waiting state and 3-2-1 countdown, starts directly"
      - "Fix replay restart properly reverts blocks using original states with batched queue"
      - "Fix fake player items no longer appear in hands when held slot is unknown"
      - "Add replay file integrity validation before starting replay"
      - "Reset reverse playback state on stop/restart to prevent state leakage"

  - version: "2.5.1"
    date: "2026-08-01"
    type: "patch"
    summary: "Remove /bw menu GUI, fix /bw start from lobby, fix replay teleporter title, fix speed-down, fix lobby border"
    items:
      - "Remove /bw menu GUI and all related classes entirely"
      - "Fix /bw start no longer shows Unknown command or anonymous command from lobby"
      - "Fix /bw start in lobby always shows cannot be used in lobby instead of no permission"
      - "Fix replay teleporter menu title changed from green to dark gray (item name stays green)"
      - "Fix Speed Down cycles speed in reverse mirroring Speed Up"
      - "Fix lobby border uses circular distance check matching arena world border"
      - "Fix lobby border applies to all players in lobby world"
      - "Fix lobby border falls back to world spawn location when lobbyLoc is null"

  - version: "2.5.0"
    date: "2026-08-01"
    type: "minor"
    summary: "Replay fixes: teleporter color, speed-down rewind, title clear, scoreboard null, team order"
    items:
      - "Change Replay Teleporter item color from dark gray to green for better visibility"
      - "Speed Down hotbar item now rewinds time instead of cycling playback speed"
      - "Add speed-down-rewind-ms config option (default: 5000ms = 5 seconds backward)"
      - "Temporary title clears when skip is blocked by cooldown preventing stale feedback"
      - "Scoreboard arena_id and build_id placeholders no longer display null"
      - "Team tab list ordering uses TeamColor ordinal for consistent ordering"
      - "/bw debug tab completion returns empty list instead of invalid option"
      - "Replay menu Server line shows arena name with match ID"
      - "ReplayConfig version bumped to 2 with automatic migration"

  - version: "2.4.0"
    date: "2026-07-31"
    type: "minor"
    summary: "Remove Rewards menu, fix deposit to only allow swords with 2+"
    items:
      - "Remove Rewards menu completely (temporarily disabled)"
      - "Remove rewards from CmdMenu tab-completion and switch cases"
      - "Fix deposit: only swords can be deposited, all other non-stackable items blocked"
      - "Swords require at least 2 in inventory to deposit (single sword protected)"
      - "Shift-click deposits all matching swords except held slot"
      - "Single click deposits 1 sword only if player has 2+ of that type"

  - version: "2.3.2"
    date: "2026-07-31"
