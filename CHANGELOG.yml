version: "2.3.1"
date: "2026-07-31"
changes:
  - version: "2.3.1"
    date: "2026-07-31"
    type: "patch"
    summary: "Rebuild menu system matching screenshots exactly"
    items:
      - "Rebuild Main Menu (36 slots) with The Slumber Hotel, My Cosmetics, Game Settings, Close"
      - "Rebuild Game Settings (45 slots) with 10 toggleable settings matching exact screenshot lore text"
      - "Rebuild Chat Settings (45 slots) with 9 settings including Public/Party/FM Profanity Filters, Message Sounds, Chat Alerts, Chat Keywords"
      - "Rebuild Rewards menu (27 slots) with Quests, Bed Wars Experience, Tokens"
      - "All toggles use lime/red stained glass panes with exact lore format matching screenshots"
      - "Multi-option toggles (Profanity Filters) cycle through On/Off with > marker"
      - "No chat messages on toggle, no animations, instant menu transitions"
      - "Fix Material.EXPERIENCE_BOTTLE to Material.EXP_BOTTLE for 1.8.8 compatibility"

  - version: "2.3.0"
    date: "2026-07-31"
    type: "minor"
    summary: "Add /bw menu command with Game Settings and Rewards menus, fix /bw start and deposit"
    items:
      - "Add /bw menu command with main menu (Quests, Cosmetics, Game Settings, Rewards)"
      - "Fix /bw start canSee returning false for players with forcestart permission"
      - "Fix deposit for non-stackable items: single click deposits 1, shift-click deposits all except held slot"

  - version: "2.2.1"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix join tab-complete, remove ranked fallback, enhance debug"
    items:
      - "Fix /bw join tab-complete not showing subcommands"
      - "Remove ranked fallback in handleRandomJoin"
      - "Enhance /bw debug with DEBUG | prefix and more event handlers"
      - "Fix SetType to read team size from config instead of hardcoding"

  - version: "2.2.0"
    date: "2026-07-31"
    type: "minor"
    summary: "Fix config key case-sensitivity, hotbar pickup, debug NPE"
    items:
      - "Fix maxInTeam=0 by reading lowercase config keys with fallback"
      - "Fix /bw debug NPE caused by ConcurrentHashMap.put with null"
      - "Revert hotbar pickup for null-category items to default Bukkit behavior"

  - version: "2.1.9"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix maxInTeam=0, add /bw debug, silence clone cleanup"
    items:
      - "Fix maxInTeam=0 by reading maxinteam with fallback"
      - "Add /bw debug command for in-arena debug mode"
      - "Silence per-clone cleanup logs to single summary line"

  - version: "2.1.8"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix party size bug and clone tab-complete routing"
    items:
      - "Fix party size returning 0 for solo players"
      - "Fix /bw join map tab-complete routing"

  - version: "2.1.7"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix XItemStack VerifyError and quest menu improvements"
    items:
      - "Fix XItemStack VerifyError by adding -dontobfuscate"
      - "Add Already Selected hover text and color-coded rewards"

  - version: "2.1.6"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix join lockout when all arenas are ranked"
    items:
      - "Restore admin bypass in canBypassRankedRestriction"
      - "Fix BedWarsAdapter.onArenaJoin for OPs and admins"

  - version: "2.1.5"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix tab-completion to exclude clone arenas"
    items:
      - "Exclude clone arenas from all tab-completion"
      - "Restrict forcejoin world to lobby world only"

  - version: "2.1.4"
    date: "2026-07-31"
    type: "patch"
    summary: "Ranked access control and clone cleanup"
    items:
      - "Block manual entry to ranked arenas"
      - "Aggressive clone cleanup on shutdown"
      - "Interactive arenagroup help"

  - version: "2.1.3"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix ProGuard VerifyError with all JDK jmods"
    items:
      - "Add all JDK jmods as ProGuard libraryjars"

  - version: "2.1.2"
    date: "2026-07-31"
    type: "patch"
    summary: "ProGuard library preservation and addon fixes"
    items:
      - "Preserve all third-party library bytecode"
      - "Fix InvisibilityFootsteps, Voidless, ArenaStartAnnouncer, WorldBorderListener, RankedQueueManager"

  - version: "2.1.1"
    date: "2026-07-31"
    type: "patch"
    summary: "ProGuard StackMapTable fix and optimizations"
    items:
      - "Fix VerifyError by removing -dontpreverify"
      - "5 tick-hot path optimizations"

  - version: "2.1.0"
    date: "2026-07-31"
    type: "minor"
    summary: "Gradle migration and ProGuard"
    items:
      - "Migrate from Maven to Gradle Kotlin DSL"
      - "Fix slime world accumulation"
      - "Add random lobby spawn"
      - "Fix hotbar pickup and deposit"

  - version: "2.0.0"
    date: "2026-07-30"
    type: "major"
    summary: "Gradle migration from Maven"
    items:
      - "Multi-module Gradle build with Shadow plugin"
      - "Java 21 toolchain enforcement"
      - "Arena config format cleanup"
