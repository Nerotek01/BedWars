version: "2.3.0"
date: "2026-07-31"
changes:
  - version: "2.3.0"
    date: "2026-07-31"
    type: "minor"
    summary: "Add /bw menu command with Game Settings and Rewards menus, fix /bw start and deposit"
    items:
      - "Add /bw menu command with main menu (Quests, Cosmetics, Game Settings, Rewards)"
      - "Add Game Settings menu with 10 toggleable settings (Auto Queue, Particle Quality, etc.)"
      - "Add Chat Settings submenu with 5 toggleable settings"
      - "Add Rewards menu with Quests, Bed Wars Experience, and Tokens links"
      - "All toggles use lime/red stained glass panes, no chat messages on toggle"
      - "No menu open/close animations - instant transitions"
      - "Sub-menus accessible via /bw menu <Tab> (settings, cosmetics, quests, rewards, chat)"
      - "Fix /bw start canSee returning false for players with forcestart permission in waiting arena"
      - "Fix deposit for non-stackable items: single click deposits 1 from hand, shift-click deposits all except held slot"

  - version: "2.2.1"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix join tab-complete, remove ranked fallback, enhance debug, fix SetType hardcoded groups"
    items:
      - "Fix /bw join tab-complete not showing subcommands when pressing Tab after 'join'"
      - "Remove ranked fallback in handleRandomJoin that allowed /bw join random to enter ranked arenas"
      - "Enhance /bw debug with DEBUG | prefix in gold/gray colors"
      - "Add item pickup, item drop, shop buy, block place, and block break to debug logging"
      - "Fix /bw debug showInList to true for OP tab-completion visibility"
      - "Add disableForPlayer to auto-disable debug when player leaves arena"
      - "Fix SetType to read team size from config 'group-team-sizes' instead of hardcoding Solo/Doubles/3v3/4v4"
      - "Fix debug auto-disable when arena game ends and player returns to lobby"

  - version: "2.2.0"
    date: "2026-07-31"
    type: "minor"
    summary: "Fix critical config key case-sensitivity, hotbar pickup, debug NPE, and replay border config"
    items:
      - "Fix maxInTeam=0 by reading lowercase config keys with camelCase fallback in Arena constructor, CmdStart, SetMaxInTeam, SetType, and CreateTeam"
      - "Fix minPlayers and allowSpectate to also use lowercase keys with fallbacks"
      - "Fix ReplayPlayer world-border config to read world-border.size/enabled with worldBorderSize/worldBorderEnabled fallback"
      - "Fix /bw debug NPE caused by ConcurrentHashMap.put with null value"
      - "Fix /bw debug canSee to allow OPs in lobby"
      - "Revert hotbar pickup for null-category items to default Bukkit behavior"
      - "Audit all setup commands for case-sensitive config key writes"

  - version: "2.1.9"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix maxInTeam=0 bug, add /bw debug command, silence clone cleanup logs"
    items:
      - "Fix maxInTeam=0 by reading maxinteam with maxInTeam fallback"
      - "Add /bw debug command for in-arena debug mode"
      - "Debug shows player movement, damage, deaths, interactions, and teleports in chat only"
      - "Silence per-clone cleanup logs to a single summary line on startup"

  - version: "2.1.8"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix party size bug and clone tab-complete routing"
    items:
      - "Fix party size returning 0 for solo players"
      - "Fix /bw join map tab-complete not calling getTabComplete(String[])"
      - "Fix getEffectivePartySize to return at least 1"

  - version: "2.1.7"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix XItemStack VerifyError and add quest menu improvements"
    items:
      - "Fix XItemStack VerifyError by adding -dontobfuscate to ProGuard"
      - "Add Already Selected hover text in green for started quests"
      - "Color-code quest rewards: aqua for XP, gold for coins, dark green for tokens"

  - version: "2.1.6"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix critical join lockout when all arenas are ranked"
    items:
      - "Restore admin bypass in canBypassRankedRestriction for OPs and admins"
      - "Fix BedWarsAdapter.onArenaJoin to allow OPs and admins through the event listener"

  - version: "2.1.5"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix tab-completion to exclude clone arenas"
    items:
      - "Exclude clone arenas from all tab-completion commands"
      - "Restrict /bw join forcejoin all world argument to only suggest the lobby world"

  - version: "2.1.4"
    date: "2026-07-31"
    type: "patch"
    summary: "Ranked access control and clone cleanup"
    items:
      - "Block all manual entry to ranked arenas for regular players"
      - "Add aggressive clone cleanup on server shutdown"
      - "Add migration of existing arena config locations to block-level precision"
      - "Make /bw arenagroup help messages interactive with hover and click"

  - version: "2.1.3"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix ProGuard VerifyError with all JDK jmods"
    items:
      - "Fix third VerifyError by adding all JDK jmods as ProGuard libraryjars"

  - version: "2.1.2"
    date: "2026-07-31"
    type: "patch"
    summary: "ProGuard library preservation and addon bug fixes"
    items:
      - "Fix second VerifyError by preserving all third-party library bytecode"
      - "Fix InvisibilityFootsteps cross-world crash"
      - "Fix Voidless NPE on null group"
      - "Fix ArenaStartAnnouncer NPE on null group or prefix"
      - "Fix WorldBorderListener stale per-player cache on arena leave"
      - "Fix RankedQueueManager never removing quitters from queue"

  - version: "2.1.1"
    date: "2026-07-31"
    type: "patch"
    summary: "ProGuard StackMapTable fix and performance optimizations"
    items:
      - "Fix first VerifyError by removing -dontpreverify from ProGuard config"
      - "Apply 5 tick-hot path optimizations for high arena and player count"

  - version: "2.1.0"
    date: "2026-07-31"
    type: "minor"
    summary: "Gradle migration and ProGuard obfuscation"
    items:
      - "Migrate build system from Maven to Gradle using Kotlin DSL"
      - "Fix slime world file accumulation with orphan cleanup on startup"
      - "Add random lobby spawn feature"
      - "Fix hotbar item pickup routing"
      - "Fix deposit for non-stackable items"

  - version: "2.0.0"
    date: "2026-07-30"
    type: "major"
    summary: "Major release: Gradle migration from Maven"
    items:
      - "Migrate entire build system from Maven to Gradle Kotlin DSL"
      - "Java 21 toolchain enforcement across all modules"
      - "Arena config format cleanup with block-level location coordinate rounding"
