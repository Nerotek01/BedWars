version: "2.5.2"
date: "2026-08-01"
changes:
  - version: "2.5.2"
    date: "2026-08-01"
    type: "patch"
    summary: "Remove /bw menu completely, fix /bw debug tab, fix Speed Down reverse playback, fix replay restart, fix fake player items"
    items:
      - "Remove /bw menu command and CmdMenu class entirely - use /bw cosmetics and /bw quests directly"
      - "Fix /bw debug tab completion now works for operators in arena while playing"
      - "Fix Speed Down now enables reverse playback mode (backward at 1x/2x/4x speed)"
      - "Fix Speed Down auto-switches to 1x forward when reaching time 0"
      - "Fix Speed Up resets to forward mode when currently in reverse playback"
      - "Fix replay restart skips waiting state and 3-2-1 countdown, starts directly"
      - "Fix replay restart properly reverts blocks using original states with batched queue"
      - "Fix fake player items no longer appear in hands when held slot is unknown"
      - "Add replay file integrity validation before starting replay"
      - "Reset reverse playback state on stop/restart to prevent state leakage"

  - version: "2.5.1"
    date: "2026-08-01"
    type: "patch"
    summary: "Remove /bw menu GUI, fix /bw start from lobby, fix replay teleporter title, fix speed-down, fix lobby border"
    items:
      - "Remove /bw menu GUI and all related classes entirely"
      - "Fix /bw start no longer shows Unknown command or anonymous command from lobby"
      - "Fix /bw start in lobby always shows cannot be used in lobby instead of no permission"
      - "Fix replay teleporter menu title changed from green to dark gray (item name stays green)"
      - "Fix Speed Down cycles speed in reverse mirroring Speed Up"
      - "Fix lobby border uses circular distance check matching arena world border"
      - "Fix lobby border applies to all players in lobby world"
      - "Fix lobby border falls back to world spawn location when lobbyLoc is null"

  - version: "2.5.0"
    date: "2026-08-01"
    type: "minor"
    summary: "Replay fixes: teleporter color, speed-down rewind, title clear, scoreboard null, team order"
    items:
      - "Change Replay Teleporter item color from dark gray to green for better visibility"
      - "Speed Down hotbar item now rewinds time instead of cycling playback speed"
      - "Add speed-down-rewind-ms config option (default: 5000ms = 5 seconds backward)"
      - "Temporary title clears when skip is blocked by cooldown preventing stale feedback"
      - "Scoreboard arena_id and build_id placeholders no longer display null"
      - "Team tab list ordering uses TeamColor ordinal for consistent ordering"
      - "/bw debug tab completion returns empty list instead of invalid option"
      - "Replay menu Server line shows arena name with match ID"
      - "ReplayConfig version bumped to 2 with automatic migration"

  - version: "2.4.0"
    date: "2026-07-31"
    type: "minor"
    summary: "Remove Rewards menu, fix deposit to only allow swords with 2+"
    items:
      - "Remove Rewards menu completely (temporarily disabled)"
      - "Remove rewards from CmdMenu tab-completion and switch cases"
      - "Fix deposit: only swords can be deposited, all other non-stackable items blocked"
      - "Swords require at least 2 in inventory to deposit (single sword protected)"
      - "Shift-click deposits all matching swords except held slot"
      - "Single click deposits 1 sword only if player has 2+ of that type"

  - version: "2.3.2"
    date: "2026-07-31"
    type: "patch"
    summary: "Precise menu rebuild matching screenshots"
    items:
      - "Main Menu (27 slots) with exact layout and dark gray title"
      - "Game Settings (54 slots) with 10 toggles and multi-option Particle Quality"
      - "Chat Settings (54 slots) with 9 settings"
      - "All toggles use lime/red glass panes, yellow bold click text"

  - version: "2.3.0"
    date: "2026-07-31"
    type: "minor"
    summary: "Add /bw menu command, fix /bw start and deposit"
    items:
      - "Add /bw menu with sub-menu tab-completion"
      - "Fix /bw start canSee"
      - "Fix deposit for non-stackable items"

  - version: "2.2.0"
    date: "2026-07-31"
    type: "minor"
    summary: "Fix config key case-sensitivity and hotbar"
    items:
      - "Fix maxInTeam=0 with lowercase fallback"
      - "Fix /bw debug NPE"
      - "Revert hotbar to default Bukkit behavior"

  - version: "2.1.0"
    date: "2026-07-31"
    type: "minor"
    summary: "Gradle migration"
    items:
      - "Migrate from Maven to Gradle"
      - "Fix slime world accumulation"
      - "Add random lobby spawn"

  - version: "2.0.0"
    date: "2026-07-30"
    type: "major"
    summary: "Gradle migration from Maven"
    items:
      - "Multi-module Gradle build with Shadow plugin"
      - "Java 21 toolchain"
      - "Arena config cleanup"
