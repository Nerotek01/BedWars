    type: "minor"
    summary: "Add /bw menu command, fix /bw start and deposit"
    items:
      - "Add /bw menu command with sub-menu tab-completion"
      - "Fix /bw start canSee for forcestart permission holders"
      - "Fix deposit for non-stackable items"

  - version: "2.2.1"
    date: "2026-07-31"
    type: "patch"
    summary: "Fix join tab-complete, enhance debug, fix SetType"
