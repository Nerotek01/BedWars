version: "2.3.2"
date: "2026-07-31"
changes:
  - version: "2.3.2"
    date: "2026-07-31"
    type: "patch"
    summary: "Precise menu rebuild with exact layout matching screenshots"
    items:
      - "Main Menu (27 slots): Quests (paper), My Cosmetics (iron bars), Game Settings (redstone torch), Close (barrier)"
      - "My Cosmetics click runs /bw cosmetics menu instead of /bw cosmetics"
      - "Game Settings (54 slots): 10 toggles with exact slot positions, Categories/Settings headers, Particle Quality multi-option"
      - "Chat Settings (54 slots): 9 settings including Profanity Filters with On/Off cycling and Message Sounds"
      - "Rewards (27 slots): Quests, Bed Wars Experience, Tokens with back button"
      - "All menu titles use dark gray color code"
      - "All click text uses yellow bold formatting"
      - "Lime/red glass panes for enabled/disabled states"
      - "Multi-option toggles show all options with > marker and option-specific colors"
      - "No animations, no chat spam, instant transitions"

  - version: "2.3.1"
    date: "2026-07-31"
    type: "patch"
    summary: "Initial menu rebuild"
    items:
      - "Rebuild menu system with main menu, game settings, chat settings, rewards"
      - "Fix Material.EXP_BOTTLE for 1.8.8 compatibility"

  - version: "2.3.0"
